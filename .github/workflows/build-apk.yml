name: Build APK

"on":
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装所需 SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          sdkmanager --list_installed

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 构建 Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: 生成临时签名密钥
        # 项目要求签名配置必须位于仓库外，否则 release 任务直接失败
        # app/build.gradle.kts 查找路径为 rootProject.file("../app/tools/signing/...")
        run: |
          SIGN_DIR="${GITHUB_WORKSPACE}/../app/tools/signing"
          mkdir -p "$SIGN_DIR"
          keytool -genkeypair -v \
            -keystore "$SIGN_DIR/ComfyUIMobile-release.jks" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias comfyuimobile \
            -storepass comfyuimobile -keypass comfyuimobile \
            -dname "CN=ComfyUI Mobile, OU=Dev, O=ComfyUI, L=Unknown, ST=Unknown, C=CN"
          cat > "$SIGN_DIR/ComfyUIMobile-signing.properties" <<EOF
          storeFile=$SIGN_DIR/ComfyUIMobile-release.jks
          storePassword=comfyuimobile
          keyAlias=comfyuimobile
          keyPassword=comfyuimobile
          EOF

      - name: 构建 Release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ComfyUIMobile-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: 发布 Release（免登录下载链接）
        # 仅 PR 跳过；push 与手动触发都发布，确保有免登录的公开下载链接
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          TAG="latest"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push --delete origin "$TAG" 2>/dev/null || true
          gh release create "$TAG" \
            --title "ComfyUI Mobile 自动构建 · $(date -u +'%Y-%m-%d %H:%M UTC')" \
            --notes "由 GitHub Actions 自动构建。debug 与 release 包名不同，可共存安装。" \
            --prerelease \
            app/build/outputs/apk/debug/*.apk \
            app/build/outputs/apk/release/*.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
