name: Build APK

"on":
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装所需 SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          sdkmanager --list_installed

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 构建 Debug APK
        # pipefail：让 Gradle 的失败退出码穿过 tee 管道，否则失败会被伪装成成功
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee /tmp/gradle-debug.log

      - name: 生成临时签名密钥
        # 项目要求签名配置必须位于仓库外，否则 release 任务直接失败
        # app/build.gradle.kts 查找路径为 rootProject.file("../app/tools/signing/...")
        run: |
          SIGN_DIR="${GITHUB_WORKSPACE}/../app/tools/signing"
          mkdir -p "$SIGN_DIR"
          keytool -genkeypair -v \
            -keystore "$SIGN_DIR/ComfyUIMobile-release.jks" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias comfyuimobile \
            -storepass comfyuimobile -keypass comfyuimobile \
            -dname "CN=ComfyUI Mobile, OU=Dev, O=ComfyUI, L=Unknown, ST=Unknown, C=CN"
          cat > "$SIGN_DIR/ComfyUIMobile-signing.properties" <<EOF
          storeFile=$SIGN_DIR/ComfyUIMobile-release.jks
          storePassword=comfyuimobile
          keyAlias=comfyuimobile
          keyPassword=comfyuimobile
          EOF

      - name: 构建 Release APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee /tmp/gradle-release.log

      - name: 上传 Gradle 日志（失败诊断用）
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            /tmp/gradle-debug.log
            /tmp/gradle-release.log
          if-no-files-found: ignore
          retention-days: 30

      - name: 上报编译错误到仓库文件（诊断）
        if: ${{ failure() }}
        run: |
          if [ -s /tmp/gradle-debug.log ] || [ -s /tmp/gradle-release.log ]; then
            {
              echo "构建失败于分支 ${{ github.ref_name }} · $(date -u '+%Y-%m-%d %H:%M UTC')"
              echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo '```'
              tail -c 12000 /tmp/gradle-debug.log 2>/dev/null || true
              tail -c 3000 /tmp/gradle-release.log 2>/dev/null || true
              echo '```'
            } > /tmp/error_body.txt
            gh api -X PUT "/repos/${{ github.repository }}/contents/build-errors-${{ github.run_id }}.log" \
              -f "message=ci: 记录构建错误 [skip ci]" \
              -f "content=$(base64 -w0 /tmp/error_body.txt)" || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传构建产物
        # artifact 上传失败不应阻塞 Release 发布（Release 直接上传 APK，不依赖此步骤）
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ComfyUIMobile-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: 发布 Release（免登录下载链接）
        # 仅 PR 跳过；push 与手动触发都发布，确保有免登录的公开下载链接
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          TAG="latest"
          # --cleanup-tag 让删除 release 时连同标签一起删除，避免残留标签导致重建失败
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          if gh release create "$TAG" \
              --title "ComfyUI Mobile 自动构建 · $(date -u +'%Y-%m-%d %H:%M UTC')" \
              --notes "由 GitHub Actions 自动构建。debug 与 release 包名不同，可共存安装。" \
              --prerelease \
              app/build/outputs/apk/debug/*.apk \
              app/build/outputs/apk/release/*.apk; then
            echo "✅ 已发布 latest"
          else
            FALLBACK="build-$(date -u +'%Y%m%d-%H%M%S')"
            gh release create "$FALLBACK" \
              --title "ComfyUI Mobile 自动构建（备用）· $(date -u +'%Y-%m-%d %H:%M UTC')" \
              --notes "latest 标签发布失败，这是备用构建产物（下载后请选择最新版本号）。" \
              --prerelease \
              app/build/outputs/apk/debug/*.apk \
              app/build/outputs/apk/release/*.apk
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
