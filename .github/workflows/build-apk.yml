name: Build APK

"on":
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装所需 SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          sdkmanager --list_installed

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 构建 Debug APK
        # pipefail：让 Gradle 的失败退出码穿过 tee 管道，否则失败会被伪装成成功
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee /tmp/gradle-debug.log

      - name: 恢复签名密钥缓存
        # 签名必须跨构建保持稳定：App 内更新在装 APK 前会比对签名证书，
        # 每次现生成 keystore 会导致"签名与当前应用不一致"而永远装不上。
        uses: actions/cache@v4
        with:
          path: .signing-cache
          key: comfyui-mobile-signing-keystore-v1

      - name: 准备签名配置
        # 项目要求签名配置必须位于仓库外，否则 release 任务直接失败
        # app/build.gradle.kts 查找路径为 rootProject.file("../app/tools/signing/...")
        #
        # 三级优先：① 仓库 Secret 里固定的密钥（最稳，换机器也不变）；
        # ② 上一次构建缓存下来的密钥；③ 都没有才现场生成一份并写进缓存。
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          SIGN_DIR="${GITHUB_WORKSPACE}/../app/tools/signing"
          mkdir -p "$SIGN_DIR"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "使用仓库 Secret 中的固定签名密钥"
            echo "$KEYSTORE_BASE64" | base64 -d > "$SIGN_DIR/ComfyUIMobile-release.jks"
          elif [ -f .signing-cache/ComfyUIMobile-release.jks ]; then
            echo "复用缓存中的签名密钥，保证与历史版本签名一致"
            cp .signing-cache/ComfyUIMobile-release.jks "$SIGN_DIR/"
          else
            echo "首次构建：生成签名密钥并写入缓存"
            keytool -genkeypair -v \
              -keystore "$SIGN_DIR/ComfyUIMobile-release.jks" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias comfyuimobile \
              -storepass comfyuimobile -keypass comfyuimobile \
              -dname "CN=ComfyUI Mobile, OU=Dev, O=ComfyUI, L=Unknown, ST=Unknown, C=CN"
            mkdir -p .signing-cache
            cp "$SIGN_DIR/ComfyUIMobile-release.jks" .signing-cache/
          fi
          cat > "$SIGN_DIR/ComfyUIMobile-signing.properties" <<EOF
          storeFile=$SIGN_DIR/ComfyUIMobile-release.jks
          storePassword=comfyuimobile
          keyAlias=comfyuimobile
          keyPassword=comfyuimobile
          EOF

      - name: 构建 Release APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee /tmp/gradle-release.log

      - name: 上传 Gradle 日志（失败诊断用）
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            /tmp/gradle-debug.log
            /tmp/gradle-release.log
          if-no-files-found: ignore
          retention-days: 30

      - name: 上报编译错误到仓库文件（诊断）
        if: ${{ failure() }}
        run: |
          if [ -s /tmp/gradle-debug.log ] || [ -s /tmp/gradle-release.log ]; then
            {
              echo "构建失败于分支 ${{ github.ref_name }} · $(date -u '+%Y-%m-%d %H:%M UTC')"
              echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo '== Kotlin/编译错误行 =='
              grep -aE "^e: |FAILED|What went wrong|Caused by:|Execution failed|OutOfMemory|Killed|error:" /tmp/gradle-debug.log 2>/dev/null | head -120
              echo '== 前 60 行 =='
              head -60 /tmp/gradle-debug.log 2>/dev/null
            } > /tmp/error_body.txt
            set +e
            RESP=$(gh api -X PUT "/repos/${{ github.repository }}/contents/build-errors-${{ github.run_id }}.log" \
              -f "message=ci: 记录构建错误 [skip ci]" \
              -f "content=$(base64 -w0 /tmp/error_body.txt)" 2>&1)
            echo "PUT 状态: $?"
            echo "$RESP" | head -c 500
          else
            echo "警告: gradle 日志为空，无法上报错误详情"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 读取版本号并生成校验文件
        id: version
        # App 内"检查更新"要求 Release：① 非 draft 非 prerelease；② 标签就是版本号；
        # ③ 资产里有 <apk 名>.sha256。三条缺一就不会提示更新，所以这里全部准备好。
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$VERSION" ]; then echo "::error::无法从 build.gradle.kts 解析版本号"; exit 1; fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          cd app/build/outputs/apk/release
          for apk in *.apk; do sha256sum "$apk" > "$apk.sha256"; done
          ls -l

      - name: 上传构建产物
        # artifact 上传失败不应阻塞 Release 发布（Release 直接上传 APK，不依赖此步骤）
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ComfyUIMobile-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: 发布 Release
        # 仅 PR 跳过；push 与手动触发都发布，确保有免登录的公开下载链接。
        #
        # 发布两个标签，各司其职：
        #  · v<版本号>：正式 Release。App 内"检查更新"只认这种（GitHub 的
        #    /releases/latest 端点会跳过 draft 与 prerelease，这也是以前标记成
        #    --prerelease 时检查更新永远返回 404 的原因）。
        #  · latest：固定下载链接，每次构建覆盖，标为 prerelease 免得抢掉上面的位置。
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.value }}"

          awk -v want="# v${VERSION}" 'index($0, want) == 1 { found = 1; print; next } found && /^# / { exit } found { print }' \
            RELEASE_NOTES.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            printf '由 GitHub Actions 自动构建，更新内容见仓库内 RELEASE_NOTES.md。\n' > /tmp/notes.md
          fi

          # --cleanup-tag 让删除 release 时连同标签一起删除，避免残留标签导致重建失败
          gh release delete "v${VERSION}" --yes --cleanup-tag 2>/dev/null || true
          if gh release create "v${VERSION}" \
              --title "ComfyUI Mobile v${VERSION}" \
              --notes-file /tmp/notes.md \
              app/build/outputs/apk/debug/*.apk \
              app/build/outputs/apk/release/*.apk \
              app/build/outputs/apk/release/*.sha256; then
            echo "✅ 已发布 v${VERSION}"
          else
            echo "::error::版本 Release 发布失败"
            exit 1
          fi

          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          if gh release create latest \
              --title "ComfyUI Mobile 自动构建（最新）· $(date -u +'%Y-%m-%d %H:%M UTC')" \
              --notes "固定下载链接，始终指向最近一次构建（当前 v${VERSION}）。App 内检查更新请使用带版本号的 Release。" \
              --prerelease \
              app/build/outputs/apk/debug/*.apk \
              app/build/outputs/apk/release/*.apk; then
            echo "✅ 已更新 latest"
          else
            echo "::warning::latest 标签发布失败，版本 v${VERSION} 仍可正常下载"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
